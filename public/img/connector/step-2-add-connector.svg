<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" role="img" aria-label="Add custom connector dialog with the Mango MCP server URL pasted in">
  <defs>
    <filter id="s2" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1b1b1f" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="760" height="460" fill="#FBF7F0"/>
  <!-- dimmed backdrop -->
  <rect x="40" y="34" width="680" height="392" rx="14" fill="#e9e5dd"/>
  <!-- dialog -->
  <g filter="url(#s2)">
    <rect x="170" y="84" width="420" height="300" rx="14" fill="#ffffff" stroke="rgba(27,27,31,.10)"/>
  </g>
  <text x="200" y="128" fill="#1b1b1f" font-size="18" font-weight="900" letter-spacing="-.4">Add custom connector</text>
  <text x="200" y="150" fill="#5f5b54" font-size="12.5">Connect any MCP server by URL.</text>
  <!-- Name field -->
  <text x="200" y="184" fill="#9a958c" font-size="11" font-weight="800" letter-spacing="1.2">NAME</text>
  <rect x="200" y="192" width="360" height="40" rx="8" fill="#fff" stroke="rgba(27,27,31,.18)"/>
  <text x="214" y="217" fill="#1b1b1f" font-size="13.5" font-weight="600">Mango</text>
  <!-- URL field (focused, mango ring) -->
  <text x="200" y="258" fill="#9a958c" font-size="11" font-weight="800" letter-spacing="1.2">REMOTE MCP SERVER URL</text>
  <rect x="200" y="266" width="360" height="40" rx="8" fill="#fff" stroke="#E8870B" stroke-width="2"/>
  <text x="214" y="291" fill="#1b1b1f" font-size="13" font-weight="700" font-family="ui-monospace,Menlo,monospace">https://mango.icodemybusiness.com/mcp</text>
  <!-- buttons -->
  <rect x="200" y="328" width="120" height="40" rx="8" fill="#f3f0ea"/>
  <text x="260" y="353" text-anchor="middle" fill="#5f5b54" font-size="13.5" font-weight="700">Cancel</text>
  <rect x="436" y="328" width="124" height="40" rx="8" fill="#E8870B"/>
  <text x="498" y="353" text-anchor="middle" fill="#1b1b1f" font-size="13.5" font-weight="900">Add</text>
</svg>
