<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" role="img" aria-label="Mango sign-in and authorize screen granting Claude access to your data">
  <defs>
    <filter id="s3" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1b1b1f" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="760" height="460" fill="#FBF7F0"/>
  <g filter="url(#s3)">
    <rect x="40" y="34" width="680" height="392" rx="14" fill="#ffffff" stroke="rgba(27,27,31,.10)"/>
    <rect x="40" y="34" width="680" height="48" rx="14" fill="#1b1b1f"/>
    <rect x="40" y="60" width="680" height="22" fill="#1b1b1f"/>
    <circle cx="64" cy="58" r="5" fill="#ff5f56"/><circle cx="82" cy="58" r="5" fill="#ffbd2e"/><circle cx="100" cy="58" r="5" fill="#27c93f"/>
    <text x="380" y="62" text-anchor="middle" fill="rgba(255,255,255,.65)" font-size="13" font-weight="700" font-family="ui-monospace,Menlo,monospace">mango.icodemybusiness.com</text>
  </g>
  <!-- consent card -->
  <rect x="250" y="118" width="260" height="266" rx="14" fill="#fff" stroke="rgba(27,27,31,.10)"/>
  <text x="380" y="160" text-anchor="middle" font-size="30">🥭</text>
  <text x="380" y="190" text-anchor="middle" fill="#1b1b1f" font-size="17" font-weight="900">Authorize Claude</text>
  <text x="380" y="212" text-anchor="middle" fill="#5f5b54" font-size="12">Sign in to give Claude access to</text>
  <text x="380" y="228" text-anchor="middle" fill="#5f5b54" font-size="12">your Mango workspace.</text>
  <!-- account chip -->
  <rect x="278" y="244" width="204" height="34" rx="8" fill="#faf8f4" stroke="rgba(27,27,31,.08)"/>
  <circle cx="298" cy="261" r="9" fill="#E8870B"/>
  <text x="316" y="265" fill="#5f5b54" font-size="12" font-weight="700">you@yourcompany.com</text>
  <!-- approve button -->
  <rect x="278" y="290" width="204" height="44" rx="9" fill="#E8870B"/>
  <text x="380" y="318" text-anchor="middle" fill="#1b1b1f" font-size="14.5" font-weight="900">Authorize</text>
  <text x="380" y="356" text-anchor="middle" fill="#9a958c" font-size="11">You can revoke access anytime.</text>
</svg>
