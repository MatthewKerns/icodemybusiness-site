<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" role="img" aria-label="Claude Settings, Connectors tab, with the Add custom connector button">
  <defs>
    <filter id="s1" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1b1b1f" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="760" height="460" fill="#FBF7F0"/>
  <!-- window -->
  <g filter="url(#s1)">
    <rect x="40" y="34" width="680" height="392" rx="14" fill="#ffffff" stroke="rgba(27,27,31,.10)"/>
    <rect x="40" y="34" width="680" height="48" rx="14" fill="#1b1b1f"/>
    <rect x="40" y="60" width="680" height="22" fill="#1b1b1f"/>
    <circle cx="64" cy="58" r="5" fill="#ff5f56"/><circle cx="82" cy="58" r="5" fill="#ffbd2e"/><circle cx="100" cy="58" r="5" fill="#27c93f"/>
    <text x="380" y="62" text-anchor="middle" fill="rgba(255,255,255,.65)" font-size="13" font-weight="700">Claude · Settings</text>
  </g>
  <!-- sidebar -->
  <rect x="40" y="82" width="180" height="344" fill="#faf8f4"/>
  <text x="60" y="120" fill="#9a958c" font-size="11" font-weight="800" letter-spacing="1.5">SETTINGS</text>
  <text x="60" y="152" fill="#5f5b54" font-size="13.5" font-weight="600">Profile</text>
  <text x="60" y="182" fill="#5f5b54" font-size="13.5" font-weight="600">Appearance</text>
  <rect x="48" y="196" width="164" height="30" rx="7" fill="#FBE7C6"/>
  <text x="60" y="216" fill="#7a4a05" font-size="13.5" font-weight="800">Connectors</text>
  <text x="60" y="248" fill="#5f5b54" font-size="13.5" font-weight="600">Privacy</text>
  <!-- content -->
  <text x="244" y="124" fill="#1b1b1f" font-size="20" font-weight="900" letter-spacing="-.4">Connectors</text>
  <text x="244" y="148" fill="#5f5b54" font-size="13">Connect tools and data sources Claude can use in chats.</text>
  <!-- existing connector row -->
  <rect x="244" y="170" width="452" height="56" rx="10" fill="#fff" stroke="rgba(27,27,31,.10)"/>
  <circle cx="276" cy="198" r="14" fill="#eef1f4"/>
  <text x="296" y="194" fill="#1b1b1f" font-size="13.5" font-weight="800">Google Drive</text>
  <text x="296" y="212" fill="#9a958c" font-size="11.5">Connected</text>
  <!-- Add custom connector button (highlighted) -->
  <rect x="244" y="246" width="240" height="48" rx="9" fill="#E8870B"/>
  <text x="364" y="276" text-anchor="middle" fill="#1b1b1f" font-size="14.5" font-weight="900">+  Add custom connector</text>
  <!-- pointer -->
  <circle cx="478" cy="270" r="22" fill="none" stroke="#E8870B" stroke-width="3" stroke-dasharray="4 5" opacity=".8"/>
</svg>
